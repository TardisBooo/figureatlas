<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #060911;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
}
</style>
</head>
<body>

    <div style="background: #080C14; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; color: #FFFFFF; font-family: -apple-system, sans-serif; width: 860px; height: 520px; box-sizing: border-box;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
            <div>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #38BDF8; font-weight: 700; letter-spacing: 1px;">CELESTIAL MECHANICS // ASTROPY & POLIASTRO CR3BP</div>
                <div style="font-size: 16px; font-weight: 800; color: #F8FAFC; margin-top: 2px;">CR3BP SYNODIC ORBITS &amp; LAGRANGE POINTS</div>
                <div style="font-size: 11px; color: #94A3B8; margin-top: 2px;">Rotating Frame with Jacobi Energy Contours, L1-L5 Points &amp; Lyapunov Halo Orbit</div>
            </div>
            <div style="display: flex; gap: 8px;">
                <span style="background: rgba(56,189,248,0.15); border: 1px solid #38BDF8; color: #38BDF8; font-size: 10px; font-family: monospace; padding: 2px 8px; border-radius: 4px; font-weight: 700;">MASS RATIO μ = 0.01215</span>
                <span style="background: rgba(16,185,129,0.15); border: 1px solid #10B981; color: #10B981; font-size: 10px; font-family: monospace; padding: 2px 8px; border-radius: 4px; font-weight: 700;">JACOBI C = 3.142</span>
            </div>
        </div>

        <svg viewBox="0 0 820 400" style="width: 100%; height: 400px; overflow: visible;">
            <rect width="820" height="400" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
            
            <!-- Rotating coordinate axes -->
            <line x1="50" y1="210" x2="770" y2="210" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
            <line x1="410" y1="30" x2="410" y2="370" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
            <text x="775" y="214" fill="#64748B" font-family="monospace" font-size="11">+X (Synodic)</text>
            <text x="414" y="30" fill="#64748B" font-family="monospace" font-size="11">+Y (Corotating)</text>

            <!-- Jacobi Zero-Velocity Potential Curve (Iso-contours) -->
            <path d="M120,210 C120,70 716,70 716,210 C716,350 120,350 120,210" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
            <path d="M220,210 C220,130 725,130 725,210 C725,290 220,290 220,210" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2,2" opacity="0.4"/>

            <!-- Equilateral Triangles connecting Primaries to L4 / L5 -->
            <line x1="407" y1="210" x2="536" y2="-15" stroke="#1E293B" stroke-width="1.5"/>
            <line x1="666" y1="210" x2="536" y2="-15" stroke="#1E293B" stroke-width="1.5"/>

            <!-- Primary Body 1: Earth -->
            <circle cx="407" cy="210" r="22" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2"/>
            <text x="407" y="214" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">m₁</text>
            <text x="407" y="248" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Earth (-μ, 0)</text>

            <!-- Primary Body 2: Moon -->
            <circle cx="666" cy="210" r="9" fill="#94A3B8" stroke="#F8FAFC" stroke-width="1.5"/>
            <text x="666" y="213" fill="#080C14" font-family="monospace" font-size="8" font-weight="900" text-anchor="middle">m₂</text>
            <text x="666" y="234" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Moon (1-μ, 0)</text>

            <!-- Lagrange Points L1 - L5 -->
            <!-- L1 -->
            <circle cx="627" cy="210" r="5" fill="#FA4D56"/>
            <text x="627" y="198" fill="#FA4D56" font-family="monospace" font-size="12" font-weight="800" text-anchor="middle">L₁</text>
            
            <!-- Periodic Lyapunov Halo Orbit around L1 -->
            <ellipse cx="627" cy="210" rx="18" ry="36" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
            <text x="651" y="186" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="700">Lyapunov Halo</text>

            <!-- L2 -->
            <circle cx="705" cy="210" r="5" fill="#FA4D56"/>
            <text x="705" y="198" fill="#FA4D56" font-family="monospace" font-size="12" font-weight="800" text-anchor="middle">L₂</text>

            <!-- L3 -->
            <circle cx="160" cy="210" r="5" fill="#FA4D56"/>
            <text x="160" y="198" fill="#FA4D56" font-family="monospace" font-size="12" font-weight="800" text-anchor="middle">L₃</text>

            <!-- L4 -->
            <circle cx="536" cy="-15" r="6" fill="#10B981"/>
            <text x="552" y="-11" fill="#10B981" font-family="monospace" font-size="12" font-weight="800">L₄ (Trojan)</text>

            <!-- L5 -->
            <circle cx="536" cy="435" r="6" fill="#10B981"/>
            <text x="552" y="439" fill="#10B981" font-family="monospace" font-size="12" font-weight="800">L₅ (Greek)</text>
        </svg>
    </div>
    
</body>
</html>
