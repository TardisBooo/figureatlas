<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #060911;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
}
</style>
</head>
<body>

    <div style="background: #080C14; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; color: #FFFFFF; font-family: -apple-system, sans-serif; width: 860px; height: 520px; box-sizing: border-box;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
            <div>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #F59E0B; font-weight: 700; letter-spacing: 1px;">RF ENGINEERING // SCIKIT-RF & SIGNAL INTEGRITY SPEC</div>
                <div style="font-size: 16px; font-weight: 800; color: #F8FAFC; margin-top: 2px;">MICROWAVE SMITH CHART &amp; SERIAL EYE DIAGRAM</div>
                <div style="font-size: 11px; color: #94A3B8; margin-top: 2px;">Complex S11 Reflection Trajectory on Unit Circle with 2-UI Serial Eye Mask</div>
            </div>
            <div style="display: flex; gap: 8px;">
                <span style="background: rgba(245,158,11,0.15); border: 1px solid #F59E0B; color: #F59E0B; font-size: 10px; font-family: monospace; padding: 2px 8px; border-radius: 4px; font-weight: 700;">VSWR: 1.25:1</span>
                <span style="background: rgba(16,185,129,0.15); border: 1px solid #10B981; color: #10B981; font-size: 10px; font-family: monospace; padding: 2px 8px; border-radius: 4px; font-weight: 700;">EYE HEIGHT: 380mV</span>
            </div>
        </div>

        <svg viewBox="0 0 820 400" style="width: 100%; height: 400px; overflow: visible;">
            <!-- LEFT: SMITH CHART -->
            <g id="smith-chart">
                <rect x="30" y="30" width="370" height="350" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
                <text x="50" y="56" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="700">SMITH IMPEDANCE CHART (|Γ| ≤ 1)</text>

                <!-- Outer Unit Circle (r=0) -->
                <circle cx="220" cy="220" r="140" fill="none" stroke="#475569" stroke-width="1.5"/>
                <!-- Horizontal Real Axis -->
                <line x1="80" y1="220" x2="360" y2="220" stroke="#475569" stroke-width="1.2"/>

                <!-- Constant Resistance Circles: center = (r/(1+r), 0), radius = 1/(1+r) -->
                <!-- r = 0.5 -->
                <circle cx="266.6666666666667" cy="220" r="93.33333333333333" fill="none" stroke="#334155" stroke-width="1"/>
                <!-- r = 1.0 (passes through origin) -->
                <circle cx="290.0" cy="220" r="70.0" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
                <!-- r = 2.0 -->
                <circle cx="313.3333333333333" cy="220" r="46.666666666666664" fill="none" stroke="#334155" stroke-width="1"/>

                <!-- Constant Reactance Arcs: x = +/- 1.0 -->
                <!-- x = +1.0 (inductive) -->
                <path d="M360,220 A140,140 0 0,0 220,80" fill="none" stroke="#334155" stroke-width="1"/>
                <!-- x = -1.0 (capacitive) -->
                <path d="M360,220 A140,140 0 0,1 220,360" fill="none" stroke="#334155" stroke-width="1"/>

                <!-- VSWR Circle (concentric around center Γ=0) -->
                <circle cx="220" cy="220" r="49.0" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3"/>

                <!-- S11 Frequency Trace Trajectory -->
                <path d="M122.0,262.0 Q206.0,164.0 227.0,217.2" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
                <circle cx="227.0" cy="217.2" r="5" fill="#F59E0B"/>
                <text x="235.0" y="213.2" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="800">5.8 GHz (Z_in)</text>

                <text x="50" y="378" fill="#94A3B8" font-family="monospace" font-size="10">Match: z=1.0+j0.0 (Γ=0)</text>
            </g>

            <!-- RIGHT: EYE DIAGRAM -->
            <g id="eye-diagram">
                <rect x="420" y="30" width="370" height="350" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
                <text x="440" y="56" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="700">2-UI SERIAL EYE DIAGRAM // 28 Gbps</text>

                <!-- Grid & Zero Crossover -->
                <line x1="450" y1="220" x2="760" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="610" y1="80" x2="610" y2="340" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
                <text x="610" y="358" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">0 UI (Optimal Sample)</text>
                <text x="490" y="358" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">-0.5 UI</text>
                <text x="730" y="358" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">+0.5 UI</text>

                <!-- Eye Traces (Superimposed signal transitions) -->
                <!-- Level 1 (High) & Level 0 (Low) -->
                <path d="M450,130 C530,130 570,130 610,130 C650,130 690,130 760,130" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
                <path d="M450,310 C530,310 570,310 610,310 C650,310 690,310 760,310" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>

                <!-- Falling Edge transitions (1 -> 0) -->
                <path d="M450,130 C530,130 570,310 610,310 C650,310 690,130 760,130" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
                <!-- Rising Edge transitions (0 -> 1) -->
                <path d="M450,310 C530,310 570,130 610,130 C650,130 690,310 760,310" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
                <path d="M450,130 C490,220 530,310 610,310 C690,310 730,220 760,130" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.5"/>
                <path d="M450,310 C490,220 530,130 610,130 C690,130 730,220 760,310" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.5"/>

                <!-- Hexagonal Keep-Out Mask in center -->
                <polygon points="565,220 585,175 635,175 655,220 635,265 585,265" fill="rgba(250,77,86,0.15)" stroke="#FA4D56" stroke-width="1.5"/>
                <text x="610" y="224" fill="#FA4D56" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">MASK PASS</text>

                <!-- Eye Height Arrow Indicator -->
                <line x1="610" y1="135" x2="610" y2="305" stroke="#10B981" stroke-width="2"/>
                <text x="618" y="200" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">Eye Height</text>
            </g>
        </svg>
    </div>
    
</body>
</html>
