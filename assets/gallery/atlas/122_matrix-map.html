<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #060911;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
}
</style>
</head>
<body>

    <div style="background: #0A0E17; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px 24px; width: 860px; height: 520px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 12px;">
            <div>
                <div style="font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #38BDF8; letter-spacing: 1px;">3B1B // LINEAR TRANSFORMATION</div>
                <div style="font-size: 16px; font-weight: 800; color: #F8FAFC; margin-top: 3px;">2D AFFINE BASIS MAPPING &amp; EIGENSPACE</div>
                <div style="font-size: 12px; color: #64748B;">Cartesian Grid Deformation under Linear Matrix Operator A</div>
            </div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3); padding: 4px 10px; border-radius: 4px; color: #38BDF8;">
                det(A) = 1.960
            </div>
        </div>

        <!-- Body Canvas & Side Telemetry -->
        <div style="display: flex; gap: 20px; align-items: center; flex: 1;">
            <!-- SVG Vector Canvas -->
            <div style="flex: 1; height: 380px; position: relative;">
                <svg width="100%" height="100%" viewBox="0 0 680 400" style="overflow: visible;">
                    <defs>
                        <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 8 5 L 0 9 z" fill="#F43F5E"/>
                        </marker>
                        <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
                        </marker>
                    </defs>
                    <!-- Axes -->
                    <line x1="40" y1="260" x2="640" y2="260" stroke="#475569" stroke-width="1.5"/>
                    <line x1="340" y1="80" x2="340" y2="440" stroke="#475569" stroke-width="1.5"/>
                    <!-- Grids -->
                    <line x1="145" y1="455" x2="535" y2="455" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="145" y1="455" x2="145" y2="65" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="145" y1="390" x2="535" y2="390" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="210" y1="455" x2="210" y2="65" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="145" y1="325" x2="535" y2="325" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="275" y1="455" x2="275" y2="65" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="145" y1="195" x2="535" y2="195" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="405" y1="455" x2="405" y2="65" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="145" y1="130" x2="535" y2="130" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="470" y1="455" x2="470" y2="65" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="145" y1="65" x2="535" y2="65" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/><line x1="535" y1="455" x2="535" y2="65" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.45"/>
                    <line x1="-50.0" y1="572.0" x2="574.0" y2="455.0" stroke="rgba(56,189,248,0.3)" stroke-width="1.2"/><line x1="-50.0" y1="572.0" x2="106.0" y2="65.0" stroke="rgba(129,140,248,0.3)" stroke-width="1.2"/><line x1="-24.0" y1="487.5" x2="600.0" y2="370.5" stroke="rgba(56,189,248,0.3)" stroke-width="1.2"/><line x1="54.0" y1="552.5" x2="210.0" y2="45.5" stroke="rgba(129,140,248,0.3)" stroke-width="1.2"/><line x1="2.0" y1="403.0" x2="626.0" y2="286.0" stroke="rgba(56,189,248,0.3)" stroke-width="1.2"/><line x1="158.0" y1="533.0" x2="314.0" y2="26.0" stroke="rgba(129,140,248,0.3)" stroke-width="1.2"/><line x1="54.0" y1="234.0" x2="678.0" y2="117.0" stroke="rgba(56,189,248,0.3)" stroke-width="1.2"/><line x1="366.0" y1="494.0" x2="522.0" y2="-13.0" stroke="rgba(129,140,248,0.3)" stroke-width="1.2"/><line x1="80.0" y1="149.5" x2="704.0" y2="32.5" stroke="rgba(56,189,248,0.3)" stroke-width="1.2"/><line x1="470.0" y1="474.5" x2="626.0" y2="-32.5" stroke="rgba(129,140,248,0.3)" stroke-width="1.2"/><line x1="106.0" y1="65.0" x2="730.0" y2="-52.0" stroke="rgba(56,189,248,0.3)" stroke-width="1.2"/><line x1="574.0" y1="455.0" x2="730.0" y2="-52.0" stroke="rgba(129,140,248,0.3)" stroke-width="1.2"/>
                    <!-- Area & Basis -->
                    <polygon points="340,260 444.0,240.5 470.0,156.0 366.0,175.5" fill="rgba(99,102,241,0.22)" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4,2"/>
                    
    <!-- T(i_hat) -->
    <line x1="340" y1="260" x2="444.0" y2="240.5" stroke="#F43F5E" stroke-width="3" marker-end="url(#arrow-red)"/>
    <circle cx="444.0" cy="240.5" r="4" fill="#F43F5E"/>
    <text x="456.0" y="244.5" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">T(î) = [1.6, 0.3]ᵀ</text>

    <!-- T(j_hat) -->
    <line x1="340" y1="260" x2="366.0" y2="175.5" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>
    <circle cx="366.0" cy="175.5" r="4" fill="#10B981"/>
    <text x="378.0" y="179.5" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">T(ĵ) = [0.4, 1.3]ᵀ</text>
    
                    <!-- Origin -->
                    <circle cx="340" cy="260" r="4" fill="#94A3B8"/>
                </svg>
            </div>

            <!-- Mathematical Spec Box -->
            <div style="width: 220px; background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 14px; font-family: 'JetBrains Mono', monospace;">
                <div style="font-size: 10px; color: #64748B; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; margin-bottom: 10px;">OPERATOR MATRIX</div>
                <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px;">
                    <span style="color: #94A3B8; font-size: 14px;">A = </span>
                    <div style="border-left: 2px solid #38BDF8; border-right: 2px solid #38BDF8; padding: 3px 8px; font-size: 13px; line-height: 1.4; color: #F1F5F9;">
                        <div>1.60  0.40</div>
                        <div>0.30  1.30</div>
                    </div>
                </div>
                <div style="font-size: 11px; color: #94A3B8; line-height: 1.6; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px;">
                    <div><span style="color: #64748B;">• Area Scale:</span> <b style="color: #F8FAFC;">1.96x</b></div>
                    <div><span style="color: #64748B;">• Orientation:</span> <b style="color: #10B981;">Preserved</b></div>
                    <div><span style="color: #64748B;">• Invertible:</span> <b style="color: #38BDF8;">Yes (Rank 2)</b></div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
