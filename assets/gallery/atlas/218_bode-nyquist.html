<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #060911;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
}
</style>
</head>
<body>

    <div style="background: #080C14; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; color: #FFFFFF; font-family: -apple-system, sans-serif; width: 860px; height: 520px; box-sizing: border-box;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
            <div>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #38BDF8; font-weight: 700; letter-spacing: 1px;">FREQUENCY DOMAIN TELEMETRY // PYTHON-CONTROL SPEC</div>
                <div style="font-size: 16px; font-weight: 800; color: #F8FAFC; margin-top: 2px;">BODE GAIN/PHASE &amp; NYQUIST CONTOUR</div>
                <div style="font-size: 11px; color: #94A3B8; margin-top: 2px;">Frequency Domain Stability Margins Encircling (-1, 0)</div>
            </div>
            <div style="display: flex; gap: 8px;">
                <span style="background: rgba(16,185,129,0.15); border: 1px solid #10B981; color: #10B981; font-size: 10px; font-family: monospace; padding: 2px 8px; border-radius: 4px; font-weight: 700;">GM: +14.2 dB</span>
                <span style="background: rgba(56,189,248,0.15); border: 1px solid #38BDF8; color: #38BDF8; font-size: 10px; font-family: monospace; padding: 2px 8px; border-radius: 4px; font-weight: 700;">PM: 48.6°</span>
            </div>
        </div>

        <svg viewBox="0 0 820 420" style="width: 100%; height: 420px; overflow: visible;">
            <!-- LEFT: BODE MAGNITUDE & PHASE -->
            <g id="bode-panel">
                <rect x="40" y="40" width="360" height="180" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
                <rect x="40" y="235" width="360" height="175" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
                
                <line x1="40" y1="130" x2="400" y2="130" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
                <text x="35" y="134" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">0 dB</text>
                <text x="35" y="60" fill="#64748B" font-family="monospace" font-size="10" text-anchor="end">+40</text>
                <text x="35" y="200" fill="#64748B" font-family="monospace" font-size="10" text-anchor="end">-40</text>
                <text x="50" y="58" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">MAGNITUDE |G(jω)|</text>

                <polyline points="60,80 120,85 200,110 280,160 360,220" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
                <circle cx="240" cy="130" r="4" fill="#38BDF8"/>
                <line x1="240" y1="130" x2="240" y2="350" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2,2"/>
                <text x="246" y="125" fill="#38BDF8" font-family="monospace" font-size="10">ω_gc = 12.4 rad/s</text>

                <line x1="40" y1="325" x2="400" y2="325" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
                <text x="35" y="329" fill="#FA4D56" font-family="monospace" font-size="10" text-anchor="end">-180°</text>
                <text x="35" y="255" fill="#64748B" font-family="monospace" font-size="10" text-anchor="end">0°</text>
                <text x="35" y="395" fill="#64748B" font-family="monospace" font-size="10" text-anchor="end">-270°</text>
                <text x="50" y="253" fill="#818CF8" font-family="monospace" font-size="11" font-weight="700">PHASE ∠G(jω)</text>

                <polyline points="60,260 120,275 200,320 280,390 360,420" fill="none" stroke="#818CF8" stroke-width="2.5"/>
                <circle cx="280" cy="390" r="4" fill="#818CF8"/>
                <line x1="240" y1="325" x2="240" y2="350" stroke="#10B981" stroke-width="3"/>
                <text x="246" y="342" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">PM=48.6°</text>
            </g>

            <!-- RIGHT: NYQUIST CONTOUR -->
            <g id="nyquist-panel">
                <rect x="430" y="40" width="370" height="370" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
                <text x="450" y="66" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">NYQUIST COMPLEX s-PLANE</text>
                
                <line x1="480" y1="240" x2="760" y2="240" stroke="#475569" stroke-width="1"/>
                <line x1="620" y1="100" x2="620" y2="380" stroke="#475569" stroke-width="1"/>
                <text x="765" y="244" fill="#64748B" font-family="monospace" font-size="10">Re</text>
                <text x="624" y="95" fill="#64748B" font-family="monospace" font-size="10">Im</text>

                <circle cx="620" cy="240" r="100" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="708" y="256" fill="#475569" font-family="monospace" font-size="10">|s|=1</text>

                <circle cx="520" cy="240" r="5" fill="#FA4D56"/>
                <text x="506" y="230" fill="#FA4D56" font-family="monospace" font-size="11" font-weight="800">(-1, 0)</text>

                <path d="M690,350 C740,280 600,180 555,225" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
                <path d="M690,130 C740,200 600,300 555,255" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

                <line x1="520" y1="240" x2="555" y2="240" stroke="#10B981" stroke-width="2"/>
                <text x="530" y="256" fill="#10B981" font-family="monospace" font-size="9" font-weight="700">1/GM</text>

                <text x="450" y="390" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">✓ ASYMPTOTICALLY STABLE (N=0)</text>
            </g>
        </svg>
    </div>
    
</body>
</html>
